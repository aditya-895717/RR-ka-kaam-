<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in with Google — RR Laundry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      border: 0.5px solid #e0e0e0;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }

    /* Brand row */
    .brand-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 2rem;
    }
    .brand-icon {
      width: 40px; height: 40px;
      background: #003580;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 18px; font-weight: 700;
      flex-shrink: 0;
    }
    .brand-name { font-size: 18px; font-weight: 700; color: #003580; }
    .brand-sub  { font-size: 11px; color: #888; margin-top: 1px; }

    /* Google logo bubble */
    .google-bubble {
      width: 56px; height: 56px;
      background: #f8f9fa;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.25rem;
      border: 0.5px solid #e0e0e0;
    }
    .google-bubble svg { width: 28px; height: 28px; }

    h1 {
      font-size: 21px; font-weight: 700;
      color: #111; margin-bottom: 0.5rem;
    }
    .subtitle {
      font-size: 13px; color: #666;
      line-height: 1.55; margin-bottom: 1.75rem;
    }

    /* Continue button */
    .continue-btn {
      display: block; width: 100%;
      padding: 0;
      height: 48px; line-height: 48px;
      background: #003580;
      color: white;
      border: none; border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 15px; font-weight: 600;
      cursor: pointer; text-decoration: none;
      transition: background 0.15s;
      margin-bottom: 1rem;
    }
    .continue-btn:hover { background: #0C447C; color: white; }

    .back-link {
      font-size: 13px; color: #666;
    }
    .back-link a {
      color: #185FA5; text-decoration: none; font-weight: 500;
    }
    .back-link a:hover { text-decoration: underline; }

    /* Trust row */
    .trust-row {
      display: flex; align-items: center;
      justify-content: center; gap: 18px;
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 0.5px solid #f0f0f0;
    }
    .trust-item {
      font-size: 11px; color: #aaa;
      display: flex; align-items: center; gap: 4px;
    }
    .trust-dot {
      width: 5px; height: 5px;
      background: #003580; border-radius: 50%;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="brand-row">
      <div class="brand-icon">R</div>
      <div>
        <div class="brand-name">RR Laundry</div>
        <div class="brand-sub">Varanasi's trusted laundry</div>
      </div>
    </div>

    <div class="google-bubble">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
    </div>

    <h1>Continue with Google</h1>
    <p class="subtitle">
      You are signing in to RR Laundry<br>using your Google account.
    </p>

    <form method="post" action="{% url 'socialaccount_login' provider.id %}">
      {% csrf_token %}
      {% if process %}
        <input type="hidden" name="process" value="{{ process }}">
      {% endif %}
      {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
      {% endif %}
      <button type="submit" class="continue-btn">Continue with Google</button>
    </form>

    <div class="back-link">
      Changed your mind?
      <a href="/accounts/login/">Go back to login</a>
    </div>

    <div class="trust-row">
      <div class="trust-item"><div class="trust-dot"></div> Secure</div>
      <div class="trust-item"><div class="trust-dot"></div> Private</div>
      <div class="trust-item"><div class="trust-dot"></div> One-tap login</div>
    </div>

  </div>
</body>
</html>
